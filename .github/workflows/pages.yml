name: Deploy to GitHub Pages

# main 브랜치에 push할 때마다 static/ 폴더를 GitHub Pages로 배포합니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만 — 중간에 새 push가 들어오면 이전 것은 취소하지 않고 대기시킵니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload static/ as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: static

      - id: deployment
        uses: actions/deploy-pages@v4
